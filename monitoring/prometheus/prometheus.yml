global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: serverops
    metrics_path: /internal/metrics/
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape_token
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          instance: windows-host
